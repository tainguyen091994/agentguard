name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate rules and run fixtures
        run: node dist/cli.js test
      - name: Rule count
        run: node dist/cli.js rules

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Scan this repo
        run: node dist/cli.js scan . --no-color
      - name: Scan the deliberately unsafe example
        run: |
          set +e
          node dist/cli.js scan examples/vulnerable-plugin --no-color
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 from the vulnerable example, got $code"
            exit 1
          fi
